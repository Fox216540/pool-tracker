services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_PATH: /data/pool-tracker.db
      GIN_MODE: release
    volumes:
      - pool_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    build:
      context: .
      target: web
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pool_data:
  caddy_data:
  caddy_config:
